# Graphiti MCP Server Configuration for Docker with Neo4j/FalkorDB
# Source: https://raw.githubusercontent.com/getzep/graphiti/main/mcp_server/config/config-docker-neo4j.yaml

server:
  transport: "http"  # HTTP transport (SSE is deprecated)
  host: "0.0.0.0"
  port: 8000
  
llm:
  provider: "openai"  # Options: openai, azure_openai, anthropic, gemini, groq
  model: "gpt-4o-mini"
  max_tokens: 4096
  
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}
      
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      deployment_name: ${AZURE_OPENAI_DEPLOYMENT}
      use_azure_ad: ${USE_AZURE_AD:false}
      
    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      api_url: ${ANTHROPIC_API_URL:https://api.anthropic.com}
      max_retries: 3
      
    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_PROJECT_ID:}
      location: ${GOOGLE_LOCATION:us-central1}
      
    groq:
      api_key: ${GROQ_API_KEY}
      api_url: ${GROQ_API_URL:https://api.groq.com/openai/v1}

embedder:
  provider: "openai"  # Options: openai, azure_openai, gemini, voyage
  model: "text-embedding-3-small"
  dimensions: 1536
  
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}
      
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_EMBEDDINGS_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      deployment_name: ${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT}
      use_azure_ad: ${USE_AZURE_AD:false}
      
    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_PROJECT_ID:}
      location: ${GOOGLE_LOCATION:us-central1}
      
    voyage:
      api_key: ${VOYAGE_API_KEY}
      api_url: ${VOYAGE_API_URL:https://api.voyageai.com/v1}
      model: "voyage-3"

database:
  provider: "neo4j"  # Using Neo4j for this configuration
  
  providers:
    neo4j:
      # Use environment variable if set, otherwise use Docker service hostname
      uri: ${NEO4J_URI:bolt://neo4j:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:demodemo}
      database: ${NEO4J_DATABASE:neo4j}
      use_parallel_runtime: ${USE_PARALLEL_RUNTIME:false}

graphiti:
  # Server-side fallback only. Clients derive group_id from the project folder path.
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
  entity_types:
    # === CODE & ARCHITECTURE (High Priority) ===
    - name: "Decision"
      description: "Architecture decisions, tech choices, ADRs. Look for: 'decided', 'chose', 'going with', 'use X instead of Y', 'the approach is'. PRIORITIZE - shapes future work."
    - name: "Pattern"
      description: "Recurring solutions, design patterns used. Look for: 'pattern', 'always do X', 'standard approach', 'convention is'. PRIORITIZE - guides implementation."
    - name: "Dependency"
      description: "Why packages/libraries added, known issues, upgrade notes. Look for: 'added', 'installed', 'using library', 'depends on', 'version'."
    - name: "TechDebt"
      description: "Known shortcuts, refactor candidates, code quality issues. Look for: 'hack', 'workaround', 'TODO', 'needs refactoring', 'temporary', 'tech debt'."

    # === CONTEXT & HISTORY (High Priority) ===
    - name: "BugPattern"
      description: "Bug patterns, root causes, where issues cluster. Look for: 'bug', 'error', 'issue', 'broke', 'fixed', 'root cause', 'keeps happening'."
    - name: "Rationale"
      description: "Why features built, stakeholder needs, reasoning. Look for: 'because', 'reason is', 'so that', 'in order to', 'the goal is'."
    - name: "FailedApproach"
      description: "What didn't work and why - prevents repeating mistakes. Look for: 'didn't work', 'failed', 'abandoned', 'tried but', 'doesn't scale'. PRIORITIZE - saves time."
    - name: "EnvironmentQuirk"
      description: "Environment gotchas, setup issues, workarounds. Look for: 'workaround', 'gotcha', 'watch out', 'only works if', 'environment', 'config'."

    # === EXTERNAL (Medium Priority) ===
    - name: "UserFeedback"
      description: "User requests, pain points, feature requests. Look for: 'users want', 'feedback', 'request', 'pain point', 'complained about'."
    - name: "Incident"
      description: "What broke, how fixed, prevention. Look for: 'outage', 'incident', 'broke in prod', 'postmortem', 'downtime'."
    - name: "ApiContract"
      description: "API contracts, external dependencies, versioning. Look for: 'API', 'endpoint', 'contract', 'schema', 'external service', 'integration'."

    # === PEOPLE & PROCESS ===
    - name: "Contributor"
      description: "Who knows what, expertise areas, team members. Look for: names, 'expert in', 'ask X about', 'owns', 'maintains'."
    - name: "Blocker"
      description: "What slowed work, dependencies, waiting on. Look for: 'blocked', 'waiting on', 'depends on', 'can't proceed', 'stuck'."
    - name: "Estimate"
      description: "Calibration data, estimates vs actuals. Look for: 'estimated', 'took longer', 'faster than expected', 'timeline'."

    # === PROJECT SCOPE ===
    - name: "ScopeIn"
      description: "Feature/work added to scope. Look for: 'add to scope', 'include', 'now doing', 'expanded to', 'also need'."
    - name: "ScopeOut"
      description: "Feature/work removed from scope. Look for: 'out of scope', 'drop', 'defer', 'not doing', 'remove', 'forget about'. PRIORITIZE - prevents wasted work."
    - name: "Milestone"
      description: "Key achievements, releases, checkpoints. Look for: 'released', 'shipped', 'completed', 'milestone', 'v1.0', 'done'."

    # === STANDARD TYPES ===
    - name: "Preference"
      description: "User preferences, coding style, tool choices. Look for: 'I prefer', 'I like', 'always', 'never', 'don't'."
    - name: "Requirement"
      description: "Specific needs or functionality that must be fulfilled. Look for: 'must', 'should', 'need to', 'required'."
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions."

    # === LOW PRIORITY: Fallbacks ===
    - name: "Topic"
      description: "Subject of conversation or knowledge domain (use as last resort)."
    - name: "Object"
      description: "Physical items, tools, devices (use as last resort)."
