# Run tests on every PR to catch failures before merge
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for GitClient tests

      - name: Checkout git-mem dependency
        uses: actions/checkout@v4
        with:
          repository: TonyCasey/git-mem
          path: ../git-mem

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build git-mem dependency
        run: cd ../git-mem && npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
